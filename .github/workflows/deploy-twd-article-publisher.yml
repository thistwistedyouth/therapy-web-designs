name: Deploy TWD Article Publisher

# PAUSED (4 Nov 2026, Clive): the automatic push trigger is off because the FTPS login to
# therapyresourcedirectory.com has been failing ("530 Login failed", most likely an out of date
# TWD_FTP_USERNAME / TWD_FTP_PASSWORD secret). Client sites do NOT depend on this workflow: they
# update through Check for updates, which reads dist/twd-article-publisher-update.json from main.
# To switch it back on, fix the two secrets (GitHub > Settings > Secrets and variables > Actions)
# and put the "push" block back as it was:
#   push:
#     branches: [main]
#     paths:
#       - "plugins/twd-article-publisher/**"
# It can still be run by hand from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          php -l plugins/twd-article-publisher/twd-article-publisher.php
          for f in plugins/twd-article-publisher/includes/*.php plugins/twd-article-publisher/templates/*.php; do
            php -l "$f"
          done

      - name: JS syntax check
        run: node --check plugins/twd-article-publisher/assets/publisher.js

      - name: Deploy over FTPS to therapyresourcedirectory.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.gb.stackcp.com
          username: ${{ secrets.TWD_FTP_USERNAME }}
          password: ${{ secrets.TWD_FTP_PASSWORD }}
          protocol: ftps
          local-dir: plugins/twd-article-publisher/
          server-dir: wp-content/plugins/twd-article-publisher/
          exclude: |
            **/CLAUDE.md
            **/.git*
            **/.git*/**
